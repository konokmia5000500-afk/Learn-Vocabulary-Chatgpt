name: Build Learn Vocabulary Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0 and cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37-ext1" \
            "build-tools;37.0.0"

      - name: Extract project ZIP or use conventional repository layout
        id: locate-project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/project-source.zip" ]]; then
            mkdir -p "$RUNNER_TEMP/learn-vocabulary-source"
            unzip -q "$GITHUB_WORKSPACE/project-source.zip" -d "$RUNNER_TEMP/learn-vocabulary-source"
            PROJECT_ROOT="$(find "$RUNNER_TEMP/learn-vocabulary-source" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          else
            PROJECT_ROOT="$GITHUB_WORKSPACE"
          fi
          if [[ -z "${PROJECT_ROOT:-}" || ! -f "$PROJECT_ROOT/settings.gradle.kts" ]]; then
            echo "Could not find settings.gradle.kts. Add project-source.zip or commit the extracted Android project." >&2
            exit 1
          fi
          if [[ -f "$GITHUB_WORKSPACE/words.json" ]]; then
            mkdir -p "$PROJECT_ROOT/app/src/main/assets"
            cp "$GITHUB_WORKSPACE/words.json" "$PROJECT_ROOT/app/src/main/assets/words.json"
            echo "Copied repository-root words.json into the Android assets directory."
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_ROOT"

      - name: Run unit tests and assemble release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace --warning-mode all \
            :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee build-ci.log

      - name: Upload release APK and build log
        uses: actions/upload-artifact@v4
        with:
          name: LearnVocabulary-release-apk
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
            ${{ env.PROJECT_ROOT }}/build-ci.log
          if-no-files-found: error
          retention-days: 14
          
