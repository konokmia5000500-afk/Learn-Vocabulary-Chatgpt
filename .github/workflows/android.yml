name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub Actions ট্যাব থেকে ম্যানুয়ালি রান করার সুবিধা

# Gradle ডিরেক্টরির জন্য ডিফল্ট ওয়ার্কিং ডিরেক্টরি
# যদি আপনার GitHub repo-র একদম রুটে build.gradle.kts থাকে, তবে নিচের দুটি লাইন মুছে দিন বা '.' করুন
defaults:
  run:
    working-directory: LearnVocabulary

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LearnVocabulary-debug-apk
          path: LearnVocabulary/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
