name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. অবশ্যই setup-java-এর আগে checkout থাকতে হবে
      - name: Checkout repository
        uses: actions/checkout@v4

      # ২. v4-এর বদলে v5 ব্যবহার করুন
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: LearnVocabulary # রুট ফোল্ডারে থাকলে এই লাইনটি বাদ দিন

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: LearnVocabulary # রুট ফোল্ডারে থাকলে এই লাইনটি বাদ দিন

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LearnVocabulary-debug-apk
          path: LearnVocabulary/app/build/outputs/apk/debug/*.apk # রুট ফোল্ডারে থাকলে LearnVocabulary/ বাদ দিন
          if-no-files-found: error
